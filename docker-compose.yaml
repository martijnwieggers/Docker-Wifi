services:
  wifi-manager:
    image: wifi-manager:latest
    ports:
      - "80:8080"
    container_name: wifi-manager
    build:
      context: .      
      dockerfile: Dockerfile
      network_mode: host
    restart: always

    # Required for accessing host network interfaces (wlan0, wlan1)
    network_mode: host

    # Required for network management operations
    privileged: true

    # Required for shutdown: makes PID 1 refer to the host's init (systemd),
    # so nsenter -t 1 correctly enters the host's namespaces.
    pid: host

    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - TZ=Europe/Amsterdam
      - DOTNET_RUNNING_IN_CONTAINER=true

    volumes:
      # Persist logs test
      - ./logs:/app/logs

      # Access to NetworkManager
      - /var/run/dbus:/var/run/dbus:ro
      - /etc/NetworkManager:/etc/NetworkManager:ro

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # Resource limits for Raspberry Pi
    deploy:
      resources:
        limits:
          cpus: '3.0'
          memory: 6G
        reservations:
          cpus: '2'
          memory: 4G
